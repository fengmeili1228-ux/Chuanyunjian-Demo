version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chuanyunjian-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: chuanyunjian
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: chuanyunjian-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
